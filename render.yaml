services:
  - type: web
    name: chainos-control-tower
    runtime: static
    buildCommand: npm test
    staticPublishPath: .
  - type: web
    name: chainos-api
    runtime: node
    plan: free
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: CHAINOS_ALLOWED_ORIGIN
        value: https://chainos.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: CHAINOS_WORKSPACE_KEY
        value: northstar-mobility
